[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asin-pricepulse"
version = "1.3.0"
description = "ASIN PricePulse 价格脉搏 — AST-internal batch Amazon ASIN price fetcher across 17 marketplaces"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AST-CN LCS" }]
license = { text = "Amazon Internal Use Only" }
dependencies = [
    "requests>=2.28.0",
    "openpyxl>=3.0",
]

[project.scripts]
pricepulse = "pricepulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pricepulse*"]
